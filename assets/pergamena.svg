<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4dac3"/><stop offset=".5" stop-color="#d8ccb0"/><stop offset="1" stop-color="#c2b490"/></linearGradient>
<radialGradient id="edge" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#4a3f2a" stop-opacity="0"/><stop offset="1" stop-color="#40361f" stop-opacity=".34"/></radialGradient>
